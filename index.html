<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我們的婚禮</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            background-color: #e7dfd4;
            scroll-behavior: smooth;
            color: #5a4f43;
        }

        /* 1. 歡迎封面 */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e7dfd4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-in-out, visibility 1s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .cover-photo {
            width: 90%;
            max-width: 450px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            transition: transform 0.2s ease;
        }

        #welcome-screen:active .cover-photo {
            transform: scale(0.98);
        }

        .click-hint {
            margin-top: 25px;
            font-size: 0.95rem;
            color: #836d5d;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* 2. 開場影片區塊 */
        #video-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #skip-btn {
            position: absolute;
            top: 40px;
            right: 20px;
            padding: 6px 14px;
            background: rgba(0,0,0,0.4);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 9001;
        }

        /* 3. 喜帖主內容區 */
        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease-in-out;
        }

        #main-content.visible {
            opacity: 1;
            visibility: visible;
        }
