<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我們的婚禮</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            background-color: #e7dfd4;
            scroll-behavior: smooth;
            color: #5a4f43;
        }

        /* 1. 歡迎封面 (點擊觸發影片) */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e7dfd4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-in-out, visibility 1s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .cover-photo {
            width: 90%;
            max-width: 450px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            transition: transform 0.2s ease;
        }

        #welcome-screen:active .cover-photo {
            transform: scale(0.98);
        }

        .click-hint {
            margin-top: 25px;
            font-size: 0.95rem;
            color: #836d5d;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* 2. 開場影片區塊 */
        #video-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #skip-btn {
            position: absolute;
            top: 40px;
            right: 20px;
            padding: 6px 14px;
            background: rgba(0,0,0,0.4);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 9001;
        }

        /* 3. 喜帖主內容區 */
        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease-in-out;
        }

        #main-content.visible {
            opacity: 1;
            visibility: visible;
        }

        /* 滿版照片專用區塊 (移除所有留白與置中設定，讓照片自然往下排) */
        .full-bleed-section {
            width: 100%;
            padding: 0;
            margin: 0;
            display: block;
        }

        /* 滿版照片圖片樣式 (寬度100%貼齊邊緣) */
        .full-bleed-img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
        }

        /* 地圖區塊保留原本的留白與置中 */
        .section-map {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
            background-color: transparent;
        }

        .photo-text {
            width: 85%;
            max-width: 400px;
            text-align: center;
            line-height: 1.6;
            letter-spacing: 1px;
            font-size: 0.95rem;
            color: #6a5e51;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            margin-top: 20px;
            background-color: #836d5d;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 1rem;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        #music-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: rgba(131, 109, 93, 0.85);
            color: white;
            border: none;
            font-size: 20px;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 1s;
            pointer-events: none;
        }

        #music-toggle.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .spin { animation: spin 3s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 背景音樂 -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- 1. 歡迎封面 (點擊整個區塊都會觸發影片) -->
    <div id="welcome-screen" onclick="startVideo()">
        <img src="photo1.jpg" alt="婚禮封面" class="cover-photo">
        <div class="click-hint">點擊照片開啟喜帖</div>
    </div>

    <!-- 2. 開場影片區 -->
    <div id="video-screen">
        <button id="skip-btn" onclick="endVideo()">略過 ➔</button>
        <video id="intro-video" playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <!-- 3. 主要內容區 (影片結束後顯示) -->
    <div id="main-content">
        
        <!-- 滑頁照片 1 (滿版無文字) -->
        <div id="section-photo1" class="full-bleed-section">
            <img src="photo2.jpg" alt="婚禮照1" class="full-bleed-img">
        </div>

        <!-- 滑頁照片 2 (滿版無文字) -->
        <div id="section-photo2" class="full-bleed-section">
            <img src="photo3.jpg" alt="婚禮照2" class="full-bleed-img">
        </div>

        <!-- 地圖與資訊區塊 -->
        <div id="section-map" class="section-map">
            <h2 style="color: #6d5b4b; letter-spacing: 2px; margin-bottom: 15px; font-size: 1.4rem;">婚宴地點</h2>
            <p class="photo-text" style="margin-bottom: 5px; font-weight: bold;">某某大飯店 宴會廳</p>
            <p class="photo-text" style="font-size: 0.85rem; margin-bottom: 25px;">台北市信義區某某路1號</p>
            
            <a href="https://maps.app.goo.gl/你的地圖連結" target="_blank" class="map-btn">
                📍 開啟地圖導航
            </a>
        </div>

    </div>

    <!-- 音樂按鈕 -->
    <button id="music-toggle" onclick="toggleMusic(event)">🎵</button>

    <script>
        const welcomeScreen = document.getElementById("welcome-screen");
        const videoScreen = document.getElementById("video-screen");
        const video = document.getElementById("intro-video");
        const mainContent = document.getElementById("main-content");
        const music = document.getElementById("bg-music");
        const musicBtn = document.getElementById("music-toggle");
        let isPlaying = false;
        let hasStarted = false;

        function startVideo() {
            if (hasStarted) return;
            hasStarted = true;

            welcomeScreen.style.opacity = "0";
            setTimeout(() => { welcomeScreen.style.visibility = "hidden"; }, 1000);

            videoScreen.style.visibility = "visible";
            videoScreen.style.opacity = "1";
            video.play().catch(e => console.log("影片播放失敗:", e));
        }

        function endVideo() {
            video.pause();
            videoScreen.style.opacity = "0";
            setTimeout(() => { videoScreen.style.visibility = "hidden"; }, 1500);

            mainContent.classList.add("visible");
            window.scrollTo(0, 0);

            musicBtn.classList.add("visible");
            music.play().then(() => {
                isPlaying = true;
                musicBtn.classList.add("spin");
            }).catch((error) => {
                console.log("自動播放背景音樂被阻擋:", error);
            });
        }

        video.addEventListener('ended', endVideo);

        function toggleMusic(event) {
            event.stopPropagation();
            if (isPlaying) {
                music.pause();
                musicBtn.classList.remove("spin");
                musicBtn.style.opacity = "0.5";
            } else {
                music.play();
                musicBtn.classList.add("spin");
                musicBtn.style.opacity = "1";
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
